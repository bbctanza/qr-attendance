<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!--
			viewport-fit=cover lets the page draw under the home-indicator/notch safe area
			instead of Safari insetting the whole page away from it. Without this,
			env(safe-area-inset-*) resolves to 0px everywhere, so the bottom nav's clearance
			below is a guess rather than a measurement - which is what let it sit flush
			against the home indicator on notched iPhones instead of floating above it.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#22c55e" />
		<!-- nonce is required: script-src has no 'unsafe-inline', so without it CSP blocks this
		     and the theme flashes light on every load in production. SvelteKit substitutes the
		     per-response value for %sveltekit.nonce%. -->
		<script nonce="%sveltekit.nonce%">
			// Prevent FOUC (Flash of Unstyled Content) / Light Mode Flash
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
