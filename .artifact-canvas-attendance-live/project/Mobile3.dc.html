<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>3 - mobile, idle</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
				<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
				<style>
					body { margin: 0; font-family: Inter, system-ui, sans-serif;
						--ink: oklch(0.129 0.042 264.695); --muted: oklch(0.554 0.046 257.417);
						--line: oklch(84.651% 0.01125 256.831); --brand: oklch(51.096% 0.17385 142.511);
						--wash: oklch(0.968 0.007 247.896); }
				</style>
			</helmet>

			<div style="position: relative; width: 390px; height: 760px; box-sizing: border-box; background: #fff; overflow: hidden">
				<!-- No title-bar Scanner button on mobile - the bottom-nav FAB already is that
				     button here, so this option drops its desktop-only duplicate rather than
				     stack two ways to reach the same scanner on one screen. -->
				<div style="padding: 16px 16px 0; font-size: 22px; font-weight: 800; color: var(--ink)">Attendance</div>

				<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
					<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--wash); font-size: 12px; color: var(--muted)">
						<span style="width: 6px; height: 6px; border-radius: 999px; background: var(--line)"></span>
						No live session
						<span style="margin-left: auto; font-weight: 700; color: var(--brand); font-size: 11.5px">Events →</span>
					</div>

					<div style="font-size: 15px; font-weight: 800; color: var(--ink)">Recent Sessions</div>
					<div style="border: 1px solid var(--line); border-radius: 14px; overflow: hidden">
						<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line)">
							<div style="width: 3px; align-self: stretch; border-radius: 2px; background: var(--brand)"></div>
							<div style="flex: 1; min-width: 0"><div style="font-size: 13px; font-weight: 700; color: var(--ink)">Choir practice</div><div style="font-size: 10.5px; color: var(--muted)">Nov 1 · 4% of 515</div></div>
							<div style="font-size: 14px; font-weight: 800; color: var(--ink)">22</div>
						</div>
						<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line)">
							<div style="width: 3px; align-self: stretch; border-radius: 2px; background: var(--line)"></div>
							<div style="flex: 1; min-width: 0"><div style="font-size: 13px; font-weight: 700; color: var(--ink)">Church Choir Practice</div><div style="font-size: 10.5px; color: var(--muted)">Nov 1 · Headcount only</div></div>
							<div style="font-size: 14px; font-weight: 800; color: var(--ink)">4</div>
						</div>
						<div style="padding: 10px 14px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--brand)">View full history</div>
					</div>
				</div>

				<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 97px; background: oklch(1 0 0 / 0.88); border-top: 1px solid var(--line)"></div>
				<div style="position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 999px; background: var(--brand); box-shadow: 0 0 0 4px var(--wash)"></div>
			</div>
		</x-dc>

		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
			class Component extends DCLogic { renderVals() { return {}; } }
		</script>
	</body>
</html>
