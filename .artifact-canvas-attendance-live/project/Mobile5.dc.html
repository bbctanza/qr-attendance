<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>5 - mobile, idle</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
				<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
				<style>
					body { margin: 0; font-family: Inter, system-ui, sans-serif;
						--ink: oklch(0.129 0.042 264.695); --muted: oklch(0.554 0.046 257.417);
						--line: oklch(84.651% 0.01125 256.831); --brand: oklch(51.096% 0.17385 142.511);
						--wash: oklch(0.968 0.007 247.896); }
				</style>
			</helmet>

			<div style="position: relative; width: 390px; height: 760px; box-sizing: border-box; background: #fff; overflow: hidden">
				<div style="padding: 16px 16px 0">
					<div style="font-size: 22px; font-weight: 800; color: var(--ink)">Attendance</div>
					<div style="margin-top: 4px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted)">
						<span style="width: 6px; height: 6px; border-radius: 999px; background: var(--line)"></span>
						No live session · <span style="color: var(--brand); font-weight: 700">Go to Events</span>
					</div>
				</div>

				<!-- Recent Sessions gets almost the whole screen - it's the only real content
				     when idle, so it's sized to actually be read, not squeezed under a panel. -->
				<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
					<div style="font-size: 15px; font-weight: 800; color: var(--ink)">Recent Sessions</div>
					<div style="border: 1px solid oklch(84.651% 0.01125 256.831 / 0.4); border-radius: 14px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.04)">
						<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 10px; color: var(--muted)">NOV 1, 2026</span><span style="font-size: 10.5px; font-weight: 700; color: var(--ink); background: var(--wash); border-radius: 999px; padding: 2px 8px">22</span></div>
						<div style="margin-top: 7px; font-size: 14.5px; font-weight: 700; color: var(--ink)">Choir practice</div>
						<div style="margin-top: 2px; font-size: 11.5px; color: var(--muted)">4% of 515 present</div>
					</div>
					<div style="border: 1px solid oklch(84.651% 0.01125 256.831 / 0.4); border-radius: 14px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.04)">
						<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 10px; color: var(--muted)">NOV 1, 2026</span><span style="font-size: 10.5px; font-weight: 700; color: var(--ink); background: var(--wash); border-radius: 999px; padding: 2px 8px">4</span></div>
						<div style="margin-top: 7px; font-size: 14.5px; font-weight: 700; color: var(--ink)">Church Choir Practice</div>
						<div style="margin-top: 2px; font-size: 11.5px; color: var(--muted)">Headcount only</div>
					</div>
					<div style="text-align: center; font-size: 12px; font-weight: 700; color: var(--brand); padding: 6px">View full history</div>
				</div>

				<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 97px; background: oklch(1 0 0 / 0.88); border-top: 1px solid var(--line)"></div>
				<div style="position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 999px; background: var(--brand); box-shadow: 0 0 0 4px var(--wash)"></div>
			</div>
		</x-dc>

		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
			class Component extends DCLogic { renderVals() { return {}; } }
		</script>
	</body>
</html>
